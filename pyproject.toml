[project]
name = "witness"
version = "0.5.0"
description = "Multi-agent, hazard-driven, ensemble historical simulator"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "SALib",
    "umap-learn",
    "pyabc",
    "matplotlib",
    "xgboost",
    "shapiq",
    "ema-workbench",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (run with --run-slow)",
    "archived: ITERATION_CLASSIFICATION.md Tier 3 — kept for history, not in v0.6 paper narrative. Run with: pytest -m archived",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
