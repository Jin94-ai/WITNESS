[project]
name = "witness"
version = "0.4.0"
description = "Agent-based, hazard-driven, ensemble historical simulator"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "SALib",
    "umap-learn",
    "pyabc",
    "matplotlib",
    "xgboost",
    "shapiq",
    "ema-workbench",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
