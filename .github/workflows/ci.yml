name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Mypy (engine/)
        run: mypy engine/
        continue-on-error: true

      - name: Pytest (fast suite) + coverage
        run: pytest -m "not slow and not archived" --tb=short -q --cov=engine --cov-report=term --cov-report=xml

      - name: Upload coverage XML
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
        continue-on-error: true

      - name: Engine integrity (no person hardcoding)
        run: |
          ! grep -rE "(peter|Peter|judas|Judas|caiaphas|vangogh|gauguin|theo)" engine/ --include="*.py" \
            | grep -vE "(example|예:|docstring|test_|# )" \
            || (echo "Engine contains person-specific reference" && exit 1)
